<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
color:white;
}

/* VIDEO FONDO */

#video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-10;

backface-visibility:hidden;
transform:translateZ(0);

will-change:transform,opacity;

opacity:1;

transition:
opacity .2s linear,
transform 6s ease,
filter 2s ease;

filter:brightness(.88);
}

video{
background:black;
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.42);
z-index:-9;
}

/* BOTONES */

.control-video{
position:fixed;
top:15px;
right:15px;
z-index:999;

background:rgba(0,0,0,.65);
color:white;

border:none;

padding:12px 18px;

border-radius:35px;

cursor:pointer;

font-size:15px;

backdrop-filter:blur(10px);
}

.reiniciar{
position:fixed;
top:15px;
left:15px;
z-index:999;

background:#ff4d6d;
color:white;

border:none;

padding:12px 18px;

border-radius:35px;

cursor:pointer;

font-size:15px;
}

/* BARRA */

.barra-global{
position:fixed;
bottom:0;
left:0;
width:100%;
z-index:9999;

background:rgba(0,0,0,.55);

backdrop-filter:blur(10px);

padding:10px 15px;
}

#seekBar{
width:100%;
cursor:pointer;
accent-color:#ff4d6d;
}

/* INTRO */

.intro{
position:fixed;
inset:0;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

text-align:center;

padding:20px;

z-index:10;
}

.intro h1{
font-size:70px;
text-shadow:0 0 25px rgba(255,255,255,.5);
animation:fade 2s;
}

.intro p{
margin-top:12px;
font-size:22px;
opacity:.9;
}

.intro button{
margin-top:25px;

background:#ff4d6d;
color:white;

border:none;

padding:16px 45px;

border-radius:40px;

font-size:22px;

cursor:pointer;

box-shadow:0 0 25px rgba(255,77,109,.6);
}

/* FRASES */

.frase{
position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:90%;

text-align:center;

font-size:58px;

line-height:1.5;

opacity:0;

transition:1s;

text-shadow:0 0 20px rgba(0,0,0,.95);
}

/* CHAT */

.chat{
position:fixed;

bottom:120px;

width:100%;

padding:18px;

max-height:55vh;

overflow-y:auto;

display:none;
}

.burbuja{
width:max-content;

max-width:75%;

background:white;

color:black;

padding:14px 18px;

border-radius:18px;

margin:10px 0;

font-size:20px;

animation:fade .4s;
}

/* OPCIONES */

.opciones{
position:fixed;

bottom:70px;

width:100%;

text-align:center;

display:none;

z-index:50;
}

.si{
background:#ff4d6d;
color:white;

border:none;

padding:18px 55px;

border-radius:40px;

font-size:22px;

cursor:pointer;

animation:latido 1s infinite;
}

.no{
position:fixed;

left:65%;
top:78%;

background:#2c2c2c;
color:white;

border:none;

padding:15px 20px;

border-radius:35px;

font-size:18px;

cursor:pointer;

transition:
left .25s ease,
top .25s ease;
}

/* FINAL */

.foto-final{
position:fixed;
inset:0;

background:black;

display:none;

justify-content:center;
align-items:center;

z-index:200;

padding:15px;
}

/* VIDEO FINAL */

.contenedor-video{
position:relative;

width:95%;
max-width:1000px;
}

#videoFinal{
width:100%;

max-height:85vh;

object-fit:contain;

border-radius:20px;

border:5px solid white;

background:black;
}

/* TAPA SELLO MEJORADA */

.tapa-sello{
position:absolute;

bottom:0;
right:0;

width:320px;
height:120px;

background:
radial-gradient(
circle at bottom right,
rgba(0,0,0,1) 20%,
rgba(0,0,0,.98) 45%,
rgba(255,77,109,.92) 100%
);

backdrop-filter:blur(12px);

border-top-left-radius:45px;

display:flex;
justify-content:center;
align-items:center;

font-size:20px;
font-weight:bold;

color:white;

box-shadow:
0 0 40px rgba(255,77,109,.9);

overflow:hidden;
}

/* CAPA EXTRA PARA TAPAR MEJOR */

.tapa-sello::before{
content:"";

position:absolute;

inset:0;

background:
linear-gradient(
to top left,
rgba(0,0,0,.98),
rgba(0,0,0,.6)
);

}

/* TEXTO */

.tapa-sello span{
position:relative;
z-index:2;
}

/* CORAZONES */

.corazon{
position:fixed;

bottom:-20px;

font-size:24px;

animation:subir 5s linear forwards;
}

/* ANIMACIONES */

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

@keyframes latido{
50%{
transform:scale(1.12);
}
}

@keyframes subir{
to{
transform:translateY(-110vh);
opacity:0;
}
}

/* CELULAR */

@media(max-width:768px){

.intro h1{
font-size:42px;
}

.intro p{
font-size:16px;
}

.intro button{
font-size:18px;
padding:15px 35px;
}

.frase{
font-size:30px;
line-height:1.6;
}

.chat{
bottom:130px;
padding:12px;
max-height:50vh;
}

.burbuja{
max-width:95%;
font-size:16px;
padding:12px 15px;
}

.si{
font-size:18px;
padding:15px 35px;
}

.no{
font-size:15px;
left:58%;
top:80%;
}

#videoFinal{
max-height:60vh;
object-fit:contain;
}

/* TAPA CELULAR */

.tapa-sello{
width:210px;
height:85px;
font-size:12px;
border-top-left-radius:30px;
}

}

</style>
</head>

<body>

<!-- VIDEO -->

<video id="video" autoplay muted loop playsinline preload="auto">
<source src="videoplayback.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- BOTONES -->

<button class="control-video" onclick="toggleMedia()">
⏸ Pausar Todo
</button>

<button class="reiniciar" onclick="reiniciarHistoria()">
🔄 Reiniciar
</button>

<!-- INTRO -->

<div class="intro" id="intro">

<h1>🎬 Nuestra Historia</h1>

<p>
Hay personas que dejan huellas imposibles de borrar...
</p>

<button onclick="start()">
Comenzar 💖
</button>

</div>

<!-- AUDIO -->

<audio id="audio">
<source src="Angel.mp3" type="audio/mp3">
</audio>

<!-- FRASES -->

<div class="frase" id="frase"></div>

<!-- CHAT -->

<div class="chat" id="chat"></div>

<!-- OPCIONES -->

<div class="opciones" id="opciones">

<button class="si" onclick="aceptar()">
Sí 💍
</button>

<button class="no" id="no">
No 😈
</button>

</div>

<!-- FINAL -->

<div class="foto-final" id="fotoFinal">

<div class="contenedor-video">

<video id="videoFinal" autoplay loop playsinline controls>
<source src="Generación de Video a partir de Foto.mp4" type="video/mp4">
</video>

<!-- TAPA SELLO -->

<div class="tapa-sello">
<span>💖 Together Forever 💖</span>
</div>

</div>

</div>

<!-- BARRA -->

<div class="barra-global">

<input
type="range"
id="seekBar"
value="0"
min="0"
max="100">

</div>

<script>

/* FRASES */

const frases=[

"Últimamente he pensado mucho en nosotros...",
"En cómo dos personas pueden quererse...",
"Y aun así tener diferencias...",
"Pero aun así...",
"Sigues siendo alguien demasiado importante para mí...",
"Mi tranquilidad...",
"Mi pensamiento más constante...",
"Y una persona imposible de olvidar..."

];

let i=0;

function start(){

document.getElementById("intro")
.style.display="none";

let audio=document.getElementById("audio");

audio.volume=0.25;

audio.play();

mostrarFrases();

}

function mostrarFrases(){

let f=document.getElementById("frase");

if(i<frases.length){

f.innerText=frases[i];

f.style.opacity=1;

setTimeout(()=>{

f.style.opacity=0;

i++;

setTimeout(mostrarFrases,1000);

},3000);

}else{

f.style.display="none";

iniciarChat();

}

}

/* CHAT */

function iniciarChat(){

let chat=document.getElementById("chat");

chat.style.display="block";

let mensajes=[

"Hola mi cachetona hermosa...",
"He pensado mucho en nosotros estos días...",
"Porque tú eres alguien demasiado especial para mí...",
"💖 ¿Quieres ser mi novia? 💖"

];

let j=0;

function enviar(){

if(j<mensajes.length){

let div=document.createElement("div");

div.className="burbuja";

div.innerText=mensajes[j];

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

let voz=
new SpeechSynthesisUtterance(mensajes[j]);

voz.lang="es-ES";
voz.rate=.90;
voz.pitch=.95;

setTimeout(()=>{

window.speechSynthesis.cancel();

speechSynthesis.speak(voz);

},80);

if(mensajes[j].includes("novia")){

setTimeout(()=>{

document.getElementById("opciones")
.style.display="block";

},1000);

return;

}

j++;

setTimeout(enviar,3000);

}

}

enviar();

}

/* BOTON NO */

let noBtn=
document.getElementById("no");

function moverNo(){

let x=Math.random()*
(window.innerWidth-140);

let y=Math.random()*
(window.innerHeight-180);

if(x<20)x=20;
if(y<20)y=20;

noBtn.style.left=x+"px";
noBtn.style.top=y+"px";

}

noBtn.addEventListener(
"mouseenter",
moverNo
);

noBtn.addEventListener(
"touchstart",
moverNo
);

/* FINAL */

function aceptar(){

document.getElementById("fotoFinal")
.style.display="flex";

let finalVideo=
document.getElementById("videoFinal");

finalVideo.currentTime=0;

finalVideo.play();

for(let i=0;i<160;i++){

setTimeout(()=>{

let c=
document.createElement("div");

c.className="corazon";

c.innerHTML="💖";

c.style.left=
Math.random()*100+"vw";

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},5000);

},i*25);

}

}

/* BARRA */

const seekBar=
document.getElementById("seekBar");

const fondoVideo=
document.getElementById("video");

fondoVideo.addEventListener("timeupdate",()=>{

seekBar.value=
(fondoVideo.currentTime/
fondoVideo.duration)*100;

});

seekBar.addEventListener("input",()=>{

fondoVideo.currentTime=
(seekBar.value*
fondoVideo.duration)/100;

});

/* PAUSAR */

function toggleMedia(){

let video=
document.getElementById("video");

let audio=
document.getElementById("audio");

let btn=
document.querySelector(".control-video");

if(video.paused){

video.play();

audio.play();

btn.innerHTML=
"⏸ Pausar Todo";

}else{

video.pause();

audio.pause();

btn.innerHTML=
"▶ Reproducir Todo";

}

}

/* REINICIAR */

function reiniciarHistoria(){

location.reload();

}

</script>

</body>
</html>
