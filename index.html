<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestra Historia 💖</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
}

/* VIDEO */
video{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    transition:transform 6s ease, filter 2s;
}

.zoom-final{
    transform:scale(1.25);
    filter:brightness(0.5);
}

/* OVERLAY */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
}

/* INTRO */
.intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:5;
}

.intro h1{
    font-size:65px;
    animation:fadeIn 2s ease;
}

.intro button{
    margin-top:20px;
    background:#ff4d6d;
    color:white;
    padding:15px 40px;
    border:none;
    border-radius:40px;
    cursor:pointer;
}

/* FRASES */
.frase{
    position:absolute;
    width:100%;
    top:50%;
    transform:translateY(-50%);
    text-align:center;
    font-size:65px;
    opacity:0;
    transition:1s;
}

/* CHAT */
.chat{
    display:none;
    position:absolute;
    bottom:120px;
    width:100%;
    max-height:60vh;
    overflow-y:auto;
    padding:20px;
}

.burbuja{
    background:white;
    color:black;
    padding:12px;
    border-radius:15px;
    margin:8px 0;
    max-width:60%;
    animation:fadeIn 0.5s;
}

/* BOTONES */
.opciones{
    display:none;
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
}

.si{
    background:#ff4d6d;
    color:white;
    padding:20px 50px;
    border:none;
    border-radius:40px;
    animation:latido 1s infinite;
}

.no{
    position:absolute;
    background:#333;
    color:white;
    padding:15px;
    border-radius:30px;
}

/* FINAL */
.foto-final{
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.foto-final img{
    max-width:70%;
    border:10px solid white;
    border-radius:10px;
}

/* ANIMACIONES */
@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes latido{
50%{transform:scale(1.15);}
}

@keyframes subir{
to{transform:translateY(-110vh);opacity:0;}
}

.corazon{
    position:fixed;
    bottom:-20px;
    font-size:25px;
    animation:subir 5s linear infinite;
}

@keyframes shake{
0%{transform:translate(2px,2px);}
25%{transform:translate(-2px,-2px);}
50%{transform:translate(2px,-2px);}
75%{transform:translate(-2px,2px);}
100%{transform:translate(0,0);}
}

/* FLASHBACK */
.flash{
    position:fixed;
    width:200px;
    border-radius:10px;
    animation:fadeIn 1s;
}
</style>
</head>

<body>

<video id="video" autoplay muted loop>
<source src="videoplayback.mp4">
</video>

<div class="overlay"></div>

<div class="intro" id="intro">
<h1>🎬 Nuestra Historia</h1>
<button onclick="start()">comenzar 💖</button>
</div>

<audio id="audio">
<source src="Danny Ocean - Me Rehúso (Official Audio) [aDCcLQto5BM].mp3">
</audio>

<div class="frase" id="frase"></div>
<div class="chat" id="chat"></div>

<div class="opciones" id="opciones">
<button class="si" onclick="aceptar()">Sí 💍</button>
<button class="no" id="no">No 😈</button>
</div>

<div class="foto-final" id="fotoFinal">
<h1>💖 Nuestra historia comienza Rousss 💖</h1>
<img src="WhatsApp Image 2026-05-03 at 7.48.08 PM.jpeg">
</div>

<script>

/* FRASES NIVEL NOVELA DIOS */
const frases=[
"No fue planeado...",
"No estaba buscando a nadie...",
"Pero llegaste tú...",
"Y sin darme cuenta...",
"Te volviste mi pensamiento favorito...",
"Mi lugar seguro...",
"Mi paz en días difíciles...",
"Y ahora...",
"No hay un solo día...",
"En el que no estés en mi mente..."
];

let i=0;

function start(){
    document.getElementById("intro").style.display="none";
    let audio=document.getElementById("audio");
    audio.volume=0.2;
    audio.play();
    mostrarFrases();
}

function mostrarFrases(){
    let f=document.getElementById("frase");

    if(i<frases.length){
        f.innerText=frases[i];
        f.style.opacity=1;

        setTimeout(()=>{
            f.style.opacity=0;
            i++;
            setTimeout(mostrarFrases,1300);
        },2600);

    }else{
        f.style.display="none";
        iniciarChat();
    }
}

/* FLASHBACK */
function flash(){
    let img=document.createElement("img");
    img.src="c:/Users/Flavia/OneDrive/Desktop/PAGINA R/foto1.jpg";
    img.className="flash";
    img.style.left=Math.random()*80+"%";
    img.style.top=Math.random()*60+"%";
    document.body.appendChild(img);
    setTimeout(()=>img.remove(),3000);
}

/* CHAT NIVEL DIOS */
function iniciarChat(){
    let chat=document.getElementById("chat");
    chat.style.display="block";

    let mensajes=[
        "Hola mi cachetona...",
        "Hay algo que llevo tiempo guardando...",
        "Y creo que ya no quiero seguir callándolo...",
        "Porque no es algo pequeño...",
        "Es algo que creció poco a poco...",
        "Sin hacer ruido...",
        "Pero haciéndose cada vez más fuerte...",
        "Hasta que se volvió imposible ignorarlo...",
        "Y es que contigo...",
        "Todo se siente diferente...",
        "Más bonito...",
        "Más real...",
        "Más... nuestro...",
        "💖 Me haces feliz...",
        "De una forma que no sabía que existía...",
        "💖 Y no quiero perder eso...",
        "💖 Ni quiero imaginar una vida sin ti...",
        "💍 ¿Quieres ser mi novia?"
    ];

    let j=0;

    function enviar(){
        if(j<mensajes.length){

            if(j==5 || j==10) flash();

            let div=document.createElement("div");
            div.className="burbuja";
            div.innerText=mensajes[j];
            chat.appendChild(div);

            let voz=new SpeechSynthesisUtterance(mensajes[j]);
            speechSynthesis.speak(voz);

            if(mensajes[j].includes("novia")){
                document.getElementById("video").classList.add("zoom-final");
                document.body.style.animation="shake 0.5s";
                let audio=document.getElementById("audio");
                audio.volume=1;

                setTimeout(()=>{
                    document.getElementById("opciones").style.display="block";
                },1200);

                return;
            }

            j++;
            setTimeout(enviar,2300);

        }
    }

    enviar();
}

/* BOTÓN NO */
let noBtn=document.getElementById("no");

function moverNo(){
    let x=Math.random()*(window.innerWidth-120);
    let y=Math.random()*(window.innerHeight-120);

    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
}

noBtn.addEventListener("mouseover",moverNo);
noBtn.addEventListener("click",moverNo);

/* FINAL */
function aceptar(){
    document.getElementById("fotoFinal").style.display="flex";

    for(let i=0;i<120;i++){
        setTimeout(()=>{
            let c=document.createElement("div");
            c.className="corazon";
            c.innerHTML="💖";
            c.style.left=Math.random()*100+"vw";
            document.body.appendChild(c);
            setTimeout(()=>c.remove(),5000);
        },i*25);
    }
}

</script>

</body>
</html>
